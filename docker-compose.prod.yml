services:
  db:
    image: postgres:16-alpine
    container_name: alentapp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alentapp-prod-net

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
    container_name: alentapp-api-prod
    image: alentapp-api:prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '3000:3000'
      - '9464:9464'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
   
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    read_only: true
    tmpfs:
     - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alentapp-prod-net
    command: sh -c "node_modules/.bin/prisma migrate deploy --config packages/api/prisma.config.ts && node packages/api/dist/app.js"


  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
      args:
      - VITE_API_URL=/api/v1
    container_name: alentapp-web-prod
    image: alentapp-web:prod
    ports:
      - '80:8080'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /var/run:uid=101,gid=101,mode=755
      - /tmp:uid=101,gid=101,mode=755
      - /var/log/nginx:uid=101,gid=101,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alentapp-prod-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:

networks:
  alentapp-prod-net: